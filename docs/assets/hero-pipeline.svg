<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .node-card { rx: 12px; stroke-width: 1.5; transition: all 0.3s ease; }
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #94a3b8; }
      .pill-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; font-weight: 700; }
      
      @keyframes pulsePath {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }

      .pulse-line {
        stroke-dasharray: 6 6;
        animation: pulsePath 2s linear infinite;
      }
      
      .core-glow {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="260"/>
    <line x1="180" y1="0" x2="180" y2="260"/>
    <line x1="320" y1="0" x2="320" y2="260"/>
    <line x1="460" y1="0" x2="460" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
    <line x1="740" y1="0" x2="740" y2="260"/>
    <line x1="880" y1="0" x2="880" y2="260"/>
    <line x1="0" y1="65" x2="960" y2="65"/>
    <line x1="0" y1="130" x2="960" y2="130"/>
    <line x1="0" y1="195" x2="960" y2="195"/>
  </g>

  <!-- Header Branding Ribbon -->
  <g transform="translate(30, 32)">
    <circle cx="10" cy="10" r="6" fill="#06b6d4" filter="url(#glow)"/>
    <text x="26" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ZYNTRIX REGULATORY COMPILER PIPELINE</text>
    <text x="700" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" fill="#64748b" text-anchor="end">DETERMINISTIC COMPLIANCE AUTHORITY: 100% | AI AUTHORITY: 0%</text>
  </g>

  <!-- Connecting Bus Lines -->
  <path d="M 120 135 L 245 135 L 370 135 L 495 135 L 620 135 L 745 135 L 860 135" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path class="pulse-line" d="M 120 135 L 860 135" fill="none" stroke="url(#cyanGlow)" stroke-width="2"/>

  <!-- NODE 1: Product Info -->
  <g transform="translate(45, 85)">
    <rect class="node-card" width="115" height="100" fill="#131c2e" stroke="#334155"/>
    <circle cx="20" cy="22" r="9" fill="#1e293b"/>
    <text class="pill-num" x="17" y="25" fill="#38bdf8">1</text>
    <text class="label-title" x="35" y="25">Input Data</text>
    <text class="label-sub" x="15" y="52">PDF / Lab Spec</text>
    <text class="label-sub" x="15" y="67">BOM / Images</text>
    <rect x="15" y="78" width="76" height="14" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="19" y="88" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748b">UNTRUSTED</text>
  </g>

  <!-- NODE 2: Product DNA -->
  <g transform="translate(185, 85)">
    <rect class="node-card" width="115" height="100" fill="#131c2e" stroke="#0284c7"/>
    <circle cx="20" cy="22" r="9" fill="#0369a1"/>
    <text class="pill-num" x="17" y="25" fill="#ffffff">2</text>
    <text class="label-title" x="35" y="25">Product DNA</text>
    <text class="label-sub" x="15" y="52">Normalized Facts</text>
    <text class="label-sub" x="15" y="67">Unit Standardized</text>
    <rect x="15" y="78" width="85" height="14" rx="4" fill="#0c4a6e" stroke="#0284c7"/>
    <text x="19" y="88" font-family="sans-serif" font-size="8" font-weight="600" fill="#38bdf8">FACT EXTRACTED</text>
  </g>

  <!-- NODE 3: BIS Applicability -->
  <g transform="translate(325, 85)">
    <rect class="node-card" width="115" height="100" fill="#131c2e" stroke="#d97706"/>
    <circle cx="20" cy="22" r="9" fill="#b45309"/>
    <text class="pill-num" x="17" y="25" fill="#ffffff">3</text>
    <text class="label-title" x="35" y="25">Applicability</text>
    <text class="label-sub" x="15" y="52">Mandatory QCOs</text>
    <text class="label-sub" x="15" y="67">Scheme I / ISI</text>
    <rect x="15" y="78" width="76" height="14" rx="4" fill="#451a03" stroke="#d97706"/>
    <text x="19" y="88" font-family="sans-serif" font-size="8" font-weight="600" fill="#fbbf24">STATUTORY</text>
  </g>

  <!-- NODE 4: Verified Retrieval -->
  <g transform="translate(465, 85)">
    <rect class="node-card" width="115" height="100" fill="#131c2e" stroke="#059669"/>
    <circle cx="20" cy="22" r="9" fill="#047857"/>
    <text class="pill-num" x="17" y="25" fill="#ffffff">4</text>
    <text class="label-title" x="35" y="25">BIS Retrieval</text>
    <text class="label-sub" x="15" y="52">Isolated Clauses</text>
    <text class="label-sub" x="15" y="67">Official Gazette</text>
    <rect x="15" y="78" width="85" height="14" rx="4" fill="#064e3b" stroke="#059669"/>
    <text x="19" y="88" font-family="sans-serif" font-size="8" font-weight="600" fill="#34d399">VERIFIED SOURCE</text>
  </g>

  <!-- NODE 5: Clause Evidence -->
  <g transform="translate(605, 85)">
    <rect class="node-card" width="115" height="100" fill="#131c2e" stroke="#6366f1"/>
    <circle cx="20" cy="22" r="9" fill="#4f46e5"/>
    <text class="pill-num" x="17" y="25" fill="#ffffff">5</text>
    <text class="label-title" x="35" y="25">Evidence Gate</text>
    <text class="label-sub" x="15" y="52">NABL Lab Reports</text>
    <text class="label-sub" x="15" y="67">Trust Firewall</text>
    <rect x="15" y="78" width="85" height="14" rx="4" fill="#1e1b4b" stroke="#6366f1"/>
    <text x="19" y="88" font-family="sans-serif" font-size="8" font-weight="600" fill="#a5b4fc">PROVENANCE OK</text>
  </g>

  <!-- NODE 6: Gap Analysis -->
  <g transform="translate(745, 85)">
    <rect class="node-card" width="115" height="100" fill="#131c2e" stroke="#10b981"/>
    <circle cx="20" cy="22" r="9" fill="#059669"/>
    <text class="pill-num" x="17" y="25" fill="#ffffff">6</text>
    <text class="label-title" x="35" y="25">Gap Analysis</text>
    <text class="label-sub" x="15" y="52">Deterministic Math</text>
    <text class="label-sub" x="15" y="67">Bitwise Exact Gap</text>
    <rect x="15" y="78" width="82" height="14" rx="4" fill="#064e3b" stroke="#10b981"/>
    <text x="19" y="88" font-family="sans-serif" font-size="8" font-weight="600" fill="#34d399">DETERMINISTIC</text>
  </g>

  <!-- NODE 7: Compliance Passport (Output) -->
  <g transform="translate(885, 85)">
    <rect class="node-card" width="60" height="100" fill="#1e1b4b" stroke="#a855f7" filter="url(#glow)" opacity="0.9"/>
    <circle cx="30" cy="25" r="14" fill="#7e22ce"/>
    <text x="25" y="30" font-family="sans-serif" font-size="14" fill="#f3e8ff">✓</text>
    <text class="label-title" x="30" y="60" text-anchor="middle" font-size="11">Passport</text>
    <text class="label-sub" x="30" y="75" text-anchor="middle" font-size="9" fill="#e9d5ff">Auditable</text>
    <text class="label-sub" x="30" y="88" text-anchor="middle" font-size="8" fill="#d8b4fe">Pre-Cert</text>
  </g>

  <!-- Footer Stats Ribbon -->
  <g transform="translate(30, 225)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
      <tspan fill="#38bdf8" font-weight="700">584</tspan> Tests Passing (100%)  •  
      <tspan fill="#38bdf8" font-weight="700">9</tspan> Architecture Layers  •  
      <tspan fill="#38bdf8" font-weight="700">11</tspan> LangGraph Nodes  •  
      <tspan fill="#38bdf8" font-weight="700">16</tspan> Edges  •  
      <tspan fill="#38bdf8" font-weight="700">0.0%</tspan> AI Authority  •  
      <tspan fill="#38bdf8" font-weight="700">100%</tspan> Deterministic Verification
    </text>
  </g>
</svg>
