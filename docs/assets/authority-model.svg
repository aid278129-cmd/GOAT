<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAuth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="authShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <style>
      .hdr-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; fill: #f8fafc; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .badge-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="380" rx="16" fill="url(#bgAuth)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Ribbon -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="4" height="22" rx="2" fill="#ef4444"/>
    <text x="14" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">ZYNTRIX COMPLIANCE AUTHORITY FIREWALL &amp; TRUST BOUNDARIES</text>
    <text x="14" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Strict cryptographic and architectural separation between probabilistic text generation and legally binding compliance authority</text>
  </g>

  <!-- Box 1: Untrusted User Input -->
  <g transform="translate(40, 90)" filter="url(#authShadow)">
    <rect width="265" height="150" rx="12" fill="#131c2e" stroke="#475569" stroke-width="1.2"/>
    <rect x="16" y="16" width="105" height="20" rx="4" fill="#0f172a" stroke="#334155"/>
    <text class="badge-tag" x="24" y="30" fill="#94a3b8">LEVEL 0: UNTRUSTED</text>
    <text class="hdr-text" x="16" y="60">User Claims &amp; Marketing</text>
    <text class="body-text" x="16" y="80">• Datasheet assertions</text>
    <text class="body-text" x="16" y="98">• Unverified spec sheets</text>
    <text class="body-text" x="16" y="116">• Self-reported compliance</text>
    <rect x="16" y="126" width="233" height="14" rx="3" fill="#450a0a"/>
    <text class="badge-tag" x="22" y="137" fill="#f87171">AUTHORITY: 0.0% (CANNOT SATISFY CLAUSE)</text>
  </g>

  <!-- Box 2: Probabilistic AI Reasoning Layer -->
  <g transform="translate(345, 90)" filter="url(#authShadow)">
    <rect width="265" height="150" rx="12" fill="#131c2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="16" y="16" width="130" height="20" rx="4" fill="#2e1065" stroke="#7c3aed"/>
    <text class="badge-tag" x="24" y="30" fill="#c4b5fd">LEVEL 1: AI_DERIVED</text>
    <text class="hdr-text" x="16" y="60">Single LLM Reasoning</text>
    <text class="body-text" x="16" y="80">• Query translation &amp; formatting</text>
    <text class="body-text" x="16" y="98">• Context explanation &amp; synthesis</text>
    <text class="body-text" x="16" y="116">• Candidate gap suggestions</text>
    <rect x="16" y="126" width="233" height="14" rx="3" fill="#450a0a"/>
    <text class="badge-tag" x="22" y="137" fill="#f87171">COMPLIANCE AUTHORITY: EXACTLY 0.0%</text>
  </g>

  <!-- Box 3: Downstream Deterministic Engines -->
  <g transform="translate(650, 90)" filter="url(#authShadow)">
    <rect width="270" height="150" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <rect x="16" y="16" width="160" height="20" rx="4" fill="#022c22" stroke="#059669"/>
    <text class="badge-tag" x="24" y="30" fill="#6ee7b7">LEVEL 2: DETERMINISTIC</text>
    <text class="hdr-text" x="16" y="60" fill="#ecfdf5">Deterministic Gates (L5, 7, 8, 9)</text>
    <text class="body-text" x="16" y="80" fill="#d1fae5">• Statutory QCO applicability (L5)</text>
    <text class="body-text" x="16" y="98" fill="#d1fae5">• Mathematical range/limit checks (L7)</text>
    <text class="body-text" x="16" y="116" fill="#d1fae5">• NABL laboratory evidence trust (L8)</text>
    <rect x="16" y="126" width="238" height="14" rx="3" fill="#022c22"/>
    <text class="badge-tag" x="22" y="137" fill="#34d399">AUTHORITY: 100.0% (BINDING DETERMINATIONS)</text>
  </g>

  <!-- Bottom Core Invariant Formula Banner -->
  <g transform="translate(40, 270)">
    <rect width="880" height="75" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">THE CARDINAL REGULATORY FORMULA ENFORCED AT COMPILE-TIME</text>
    <text x="25" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="700" fill="#f8fafc">
      Verified Requirement  ∧  Verified Evidence  ∧  Linkage  ∧  Deterministic Pass  ∧  ¬Conflict  =  <tspan fill="#10b981">SATISFIED</tspan>
    </text>
  </g>
</svg>
